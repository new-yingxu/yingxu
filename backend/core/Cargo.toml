[package]
name = "yingxu-core"
version = "0.2.0-draft.5"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
fs2 = "0.4"
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp"] }
kamadak-exif = "0.6"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.11"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", features = ["NSError", "NSFileManager", "NSString", "NSURL"] }

