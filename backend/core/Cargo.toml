[package]
name = "yingxu-core"
version = "0.2.0-draft.1"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
fs2 = "0.4"
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp"] }
kamadak-exif = "0.6"

[dev-dependencies]
tempfile = "3"

