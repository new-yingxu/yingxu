name: Android Release

# 安卓端出包：GitHub 云端 expo prebuild + gradle 构建。
# - 推送 v* 标签 → 构建并把 apk 上传到同名 Release（不存在则建草稿）。
# - 手动触发：填 tag 则同样上传 Release；留空仅出构建产物（Actions Artifacts）。
# 注意：仓库无发布 keystore，测试包以 debug 签名构建（可直接安装，不可上架）。
# 上架前需自备 keystore 并走 EAS 或本地签名构建。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（如 v1.1.0-draft.2），留空则仅出产物'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Android arm64 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: 单元测试门禁
        working-directory: source
        run: node --test tests/*.test.cjs

      - name: Expo prebuild（生成 android 工程）
        working-directory: source
        run: npx expo prebuild --platform android --no-install

      - name: 改用 debug 签名（无 keystore 的测试包）
        working-directory: source
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' android/app/build.gradle
          grep -n "signingConfig" android/app/build.gradle

      - name: Gradle 构建 apk
        working-directory: source/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 归档产物
        working-directory: source
        run: |
          VERSION=$(node -e "console.log(require('./app.json').expo.version)")
          OUT="$RUNNER_TEMP/YINGXU-${VERSION}-android-arm64.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
          echo "APK_NAME=YINGXU-${VERSION}-android-arm64.apk" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: 上传到 Release
        if: ${{ env.TAG != '' && startsWith(env.TAG, 'v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --generate-notes --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" "$APK_PATH" --clobber --repo "$GITHUB_REPOSITORY"
          echo "已上传 $APK_NAME 到 Release $TAG"
