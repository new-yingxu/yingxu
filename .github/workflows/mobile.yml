name: Pocket mobile checks

on:
  pull_request:
    paths:
      - "mobile/**"
      - "site/pocket/**"
      - "smb/pocket_tcp.py"
      - "smb/server.py"
      - "smb/static/pocket/**"
      - "smb/templates/pocket.html"
      - "tests/pocket-cloud-sync.test.cjs"
      - "tests/pocket-phone-queue.test.cjs"
      - "tests/pocket-sha256.test.cjs"
      - "tests/test_pocket_http_upload.py"
      - "tests/test_pocket_tcp.py"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "site/pocket/**"
      - "smb/pocket_tcp.py"
      - "smb/server.py"
      - "smb/static/pocket/**"
      - "smb/templates/pocket.html"
      - "tests/pocket-cloud-sync.test.cjs"
      - "tests/pocket-phone-queue.test.cjs"
      - "tests/pocket-sha256.test.cjs"
      - "tests/test_pocket_http_upload.py"
      - "tests/test_pocket_tcp.py"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pocket:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v1
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          cache-dependency-path: mobile/pnpm-lock.yaml
          install: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python server dependencies
        working-directory: .
        run: python -m pip install -r requirements.txt
      - name: Check iPhone PWA JavaScript and cloud client
        working-directory: .
        run: |
          node --check site/pocket/app.js
          node --check site/pocket/cloud-sync.js
          node --check site/pocket/sw.js
          node --test tests/pocket-cloud-sync.test.cjs tests/pocket-phone-queue.test.cjs
          node --test tests/pocket-sha256.test.cjs
          python -m unittest tests.test_pocket_http_upload tests.test_pocket_tcp -v
          node -e "JSON.parse(require('node:fs').readFileSync('site/pocket/manifest.webmanifest', 'utf8'))"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Expo package compatibility
        env:
          EXPO_OFFLINE: "1"
        run: pnpm exec expo install --check
      - name: Lint, typecheck, and unit tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Generate Android native project
        run: pnpm exec expo prebuild --no-install --platform android
      - name: Export Android bundle
        run: pnpm exec expo export --platform android --output-dir "$RUNNER_TEMP/yingxu-pocket-android"

  android-debug:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v1
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          cache-dependency-path: mobile/pnpm-lock.yaml
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Android project
        run: pnpm exec expo prebuild --no-install --platform android
      - name: Build standalone release APK for emulator smoke
        run: cd android && ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: yingxu-pocket-android-smoke-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke:
    needs: android-debug
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: yingxu-pocket-android-smoke-${{ github.sha }}
          path: mobile/test-artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: python3 mobile/scripts/android_emulator_smoke.py mobile/test-artifacts/app-release.apk
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: yingxu-pocket-android-emulator-evidence-${{ github.sha }}
          path: mobile/test-results/android-emulator/
          if-no-files-found: warn
          retention-days: 14
